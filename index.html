<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin:0; padding:0;
      font-family:'Poppins', sans-serif;
      background:linear-gradient(135deg,#ffb6c1,#ff69b4,#ff1493);
      color:#fff;
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      overflow:hidden;
    }
    h1 {
      font-size:4em;
      margin:0;
      opacity:0; transform:scale(0.8);
      animation:zoomIn 2s forwards;
      text-shadow:0 0 20px rgba(255,255,255,0.8);
    }
    p {
      font-size:1.5em; margin-top:20px;
      opacity:0; animation:fadeIn 3s forwards 1s;
    }
    @keyframes zoomIn {to{opacity:1; transform:scale(1);}}
    @keyframes fadeIn {to{opacity:1;}}

    .btn {
      margin-top:30px;
      padding:15px 30px;
      border:none; border-radius:30px;
      background:linear-gradient(45deg,#ff69b4,#ff1493);
      color:#fff; font-size:1.2em; font-weight:600;
      box-shadow:0 4px 10px rgba(0,0,0,0.3);
      transition:transform 0.3s;
      opacity:0; animation:fadeIn 2s forwards 2s;
      max-width:90%; /* biar tidak melebar di HP */
      word-wrap:break-word;
    }
    .btn:hover {transform:scale(1.05);}

    /* Hewan lucu */
    .animal {
      position:absolute; font-size:3em;
      opacity:0; animation:popUp 3s ease forwards;
    }
    @keyframes popUp {
      0% {transform:scale(0) rotate(0deg); opacity:0;}
      40% {transform:scale(1.3) rotate(15deg); opacity:1;}
      70% {transform:scale(1) rotate(-15deg);}
      100% {transform:scale(0); opacity:0;}
    }

    /* Love effect */
    .love {
      position:absolute; font-size:2.5em; color:#ff1493;
      opacity:0; animation:lovePop 3s ease forwards;
    }
    @keyframes lovePop {
      0% {transform:scale(0); opacity:0;}
      40% {transform:scale(1.3); opacity:1;}
      70% {transform:scale(1);}
      100% {transform:scale(0); opacity:0;}
    }

    /* Confetti */
    .confetti {
      position:absolute; width:8px; height:8px;
      border-radius:50%;
      animation:fall 4s linear forwards;
    }
    @keyframes fall {
      0%{transform:translateY(0);opacity:1;}
      100%{transform:translateY(600px);opacity:0;}
    }

    /* Responsive untuk HP */
    @media (max-width: 600px) {
      h1 {font-size:2em;}
      p {font-size:1em;}
      .btn {font-size:1em; padding:10px 20px;}
    }
  </style>
</head>
<body>
  <h1>🎉 Happy Birthday, sayangkuuu! 💖🎂</h1>
  <p>Semoga kamu suka ya sayang sama web yang amas kasiii</p>
  <a href="page2.html" class="btn">Ayo buka sayangkuu ➡️</a>

  <!-- Tombol musik (lebih aman di HP) -->
  <button class="btn" onclick="document.getElementById('musik').play()">🎵 Putar Musik</button>
  <audio id="musik" loop>
    <source src="I Think I Like When It Rains - WILLIS.mp3" type="audio/mpeg">
  </audio>

  <script>
    window.onload = function(){
      // Hewan lucu muncul
      let animals = ["🐱","🐰","🐻","🐧","🐶","🦊"];
      for(let i=0;i<4;i++){
        let a=document.createElement("div");
        a.className="animal";
        a.innerText=animals[Math.floor(Math.random()*animals.length)];
        a.style.left=Math.random()*90+"vw";
        a.style.top=Math.random()*80+"vh";
        document.body.appendChild(a);
        setTimeout(()=>a.remove(),3000);
      }

      // Love effect muncul
      for(let i=0;i<6;i++){
        let l=document.createElement("div");
        l.className="love";
        l.innerText="❤️";
        l.style.left=Math.random()*90+"vw";
        l.style.top=Math.random()*80+"vh";
        document.body.appendChild(l);
        setTimeout(()=>l.remove(),3000);
      }

      // Confetti
      for(let i=0;i<40;i++){
        let c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*90+"vw";
        c.style.top="0px";
        c.style.background=["#ff69b4","#ff1493","#ffc0cb","#fff","#ffd700"][Math.floor(Math.random()*5)];
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),4000);
      }
    }
  </script>
</body>
</html>
